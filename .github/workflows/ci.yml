name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyarrow requests beautifulsoup4 lxml fastapi uvicorn
      - name: Run the test suite (seeing, tower, collector)
        run: python -m pytest -q tests

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: has_go
        run: |
          if compgen -G "tower/ingest/*.go" > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT";
          else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.has_go.outputs.found == 'true'
        with:
          go-version: "1.22"
      - name: Run Go tests for the ingest daemon
        if: steps.has_go.outputs.found == 'true'
        run: go test ./...
        working-directory: tower/ingest
